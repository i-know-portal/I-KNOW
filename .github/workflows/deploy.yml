name: Deploy I-KNOW 2.0 ke GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Bina Aplikasi Statik Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod sumber
        uses: actions/checkout@v4

      - name: Sediakan Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Pasang pakej npm
        run: npm ci

      - name: Semak TypeScript
        run: npm run lint

      - name: Bina aplikasi untuk GitHub Pages (/i-know/)
        run: npm run build:gh
        env:
          VITE_BASE_PATH: /i-know/

      - name: Sediakan Pages
        uses: actions/configure-pages@v5

      - name: Muat naik artifak GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan Pages
        id: deployment
        uses: actions/deploy-pages@v4
