
name: Deploy I-KNOW ke GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Bina Aplikasi I-KNOW
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod sumber
        uses: actions/checkout@v4

      - name: Sediakan Bun
        uses: oven-sh/setup-bun@v2

      - name: Pasang pakej
        run: bun install

      - name: Semak TypeScript
        run: bun run lint

      - name: Bina aplikasi
        run: bun run build
        env:
          VITE_BASE_PATH: /I-KNOW/

      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Muat naik artifak
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan ke GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan Pages
        id: deployment
        uses: actions/deploy-pages@v4
